name: Supabase keep-alive

# Free-tier Supabase projects auto-pause after ~7 days without activity, which
# takes the whole data layer offline (search, threads, Empire Story, DB cards).
# A cheap read query twice a week counts as activity and keeps the project warm.
# The anon key is public by design (already shipped in src/db-config.js, guarded
# by read-only RLS), so no repo secret is required.

on:
  schedule:
    - cron: "0 6 * * 1,4"   # 06:00 UTC every Monday and Thursday
  workflow_dispatch: {}       # allow manual "Run workflow" from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row to keep the DB active
        run: |
          curl -sfS \
            "https://cbvkgcvngigjvodnxgxg.supabase.co/rest/v1/thread?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNidmtnY3ZuZ2lnanZvZG54Z3hnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMTY2NzAsImV4cCI6MjA5NDY5MjY3MH0.QGFnsnyH1_k4RMKNkBJhrcM4q15Ix9VjlKSzLH2t9xU" \
            -H "Accept-Profile: atlas" \
            && echo "" && echo "Supabase keep-alive ping OK"
